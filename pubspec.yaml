name: betiz
description: "BETIZ - a real-time multiplayer animal quiz party game."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cached_network_image: ^3.4.1
  connectivity_plus: ^6.1.0
  equatable: ^2.0.7
  firebase_analytics: ^11.3.6
  firebase_core: ^3.8.1
  firebase_crashlytics: ^4.1.6
  firebase_messaging: ^15.1.6
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_riverpod: ^2.6.1
  flutter_svg: ^2.0.16
  go_router: ^15.1.2
  intl: ^0.19.0
  logging: ^1.3.0
  meta: ^1.16.0
  riverpod_annotation: ^2.6.1
  shared_preferences: ^2.3.4
  supabase_flutter: ^2.8.4
  uuid: ^4.5.1

dev_dependencies:
  build_runner: ^2.4.13
  custom_lint: ^0.7.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^2.5.7
  freezed_annotation: ^2.4.4
  integration_test:
    sdk: flutter
  json_annotation: ^4.9.0
  json_serializable: ^6.9.0
  mocktail: ^1.0.4
  riverpod_generator: ^2.6.3
  riverpod_lint: ^2.6.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/animals/
    - assets/images/backgrounds/
    - assets/images/icons/
    - assets/lottie/
