<!doctype html>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FrigoChef AI — Prototype</title>
<style>
:root {
  --cream: #FFF8F3;
  --card: #FFFFFF;
  --card-hi: #FFFDF9;
  --ink: #2B2320;
  --ink-soft: #8A7F78;
  --line: rgba(43,35,32,0.08);
  --coral: #FF7A59;
  --coral-deep: #FF5A3C;
  --teal: #3FA796;
  --success: #34A853;
  --warning: #F4A825;
  --danger: #E4572E;
  --shadow: 0 10px 28px rgba(43,26,18,0.10);
  --shadow-sm: 0 4px 12px rgba(43,26,18,0.07);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --cream: #1C1410;
    --card: #2A211C;
    --card-hi: #332822;
    --ink: #F5EFEA;
    --ink-soft: #B8ACA4;
    --line: rgba(245,239,234,0.09);
    --coral: #FF8F6B;
    --coral-deep: #FF6B4A;
    --teal: #4DBFAC;
    --success: #4CD07A;
    --warning: #FFC24D;
    --danger: #FF6B4D;
    --shadow: 0 10px 28px rgba(0,0,0,0.35);
    --shadow-sm: 0 4px 12px rgba(0,0,0,0.28);
  }
}
:root[data-theme="dark"] {
  --cream: #1C1410; --card: #2A211C; --card-hi: #332822; --ink: #F5EFEA; --ink-soft: #B8ACA4;
  --line: rgba(245,239,234,0.09); --coral: #FF8F6B; --coral-deep: #FF6B4A; --teal: #4DBFAC;
  --success: #4CD07A; --warning: #FFC24D; --danger: #FF6B4D;
  --shadow: 0 10px 28px rgba(0,0,0,0.35); --shadow-sm: 0 4px 12px rgba(0,0,0,0.28);
}
:root[data-theme="light"] {
  --cream: #FFF8F3; --card: #FFFFFF; --card-hi: #FFFDF9; --ink: #2B2320; --ink-soft: #8A7F78;
  --line: rgba(43,35,32,0.08); --coral: #FF7A59; --coral-deep: #FF5A3C; --teal: #3FA796;
  --success: #34A853; --warning: #F4A825; --danger: #E4572E;
  --shadow: 0 10px 28px rgba(43,26,18,0.10); --shadow-sm: 0 4px 12px rgba(43,26,18,0.07);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--cream);
  color: var(--ink);
  font-family: -apple-system, "SF Pro Text", system-ui, sans-serif;
  overflow-x: hidden;
  overscroll-behavior-y: none;
}
.display, h1, h2, h3, .tabbar-label, button, .btn-label, .navtitle, .sectionhead .label {
  font-family: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif;
}
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
img { max-width: 100%; display: block; }
::selection { background: color-mix(in srgb, var(--coral) 35%, transparent); }

#shell {
  position: relative;
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--cream);
  display: flex;
  flex-direction: column;
  isolation: isolate;
}

/* ---------- tab screens (cross-fade) ---------- */
.tabpanel { display: none; flex: 1; flex-direction: column; min-height: 0; }
.tabpanel.active { display: flex; animation: fade .28s ease both; }
@keyframes fade { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; transform: none; } }

.scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: calc(96px + var(--safe-bottom)); }

/* ---------- pushed screens (slide stack) ---------- */
#stack { position: fixed; inset: 0; max-width: 480px; margin: 0 auto; pointer-events: none; z-index: 40; }
.screen {
  position: absolute; inset: 0;
  background: var(--cream);
  display: flex; flex-direction: column;
  transform: translateX(100%);
  transition: transform .34s cubic-bezier(.32,.72,0,1);
  pointer-events: auto;
  min-height: 100dvh;
}
.screen.in { transform: translateX(0); }
@media (prefers-reduced-motion: reduce) { .screen { transition: none; } }

/* ---------- top bar ---------- */
.topbar {
  display: flex; align-items: center; gap: 10px;
  padding: calc(14px + var(--safe-top)) 16px 12px;
  position: sticky; top: 0; z-index: 5;
  background: color-mix(in srgb, var(--cream) 88%, transparent);
  backdrop-filter: blur(14px);
}
.topbar .navtitle { flex: 1; font-size: 17px; font-weight: 650; text-align: center; margin-right: 34px; }
.iconbtn {
  width: 34px; height: 34px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: var(--card); box-shadow: var(--shadow-sm); color: var(--ink); flex-shrink: 0;
}
.iconbtn:active { transform: scale(.92); }
.iconbtn.filled-coral { background: var(--coral); color: #fff; box-shadow: none; }
.badge-dot { position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--coral); border: 2px solid var(--cream); }

/* ---------- hero / home ---------- */
.hero {
  padding: calc(28px + var(--safe-top)) 22px 8px;
  background:
    radial-gradient(120% 90% at 15% -10%, color-mix(in srgb, var(--coral) 22%, transparent), transparent 60%),
    linear-gradient(160deg, color-mix(in srgb, var(--coral) 10%, var(--cream)), var(--cream) 55%);
  text-align: center;
}
.hero h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.01em; }
.hero p.sub { margin-top: 6px; color: var(--ink-soft); font-size: 15px; line-height: 1.4; }
.hero .badge {
  width: 86px; height: 86px; margin: 20px auto 6px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: var(--card); box-shadow: var(--shadow);
  color: var(--coral);
}
.actions { display: flex; flex-direction: column; gap: 12px; padding: 18px 20px 6px; }
.bigbtn {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  padding: 22px 18px; border-radius: 24px; color: #fff;
  box-shadow: var(--shadow); font-weight: 700; font-size: 16px;
  transition: transform .15s ease;
}
.bigbtn:active { transform: scale(.97); }
.bigbtn.primary { background: linear-gradient(120deg, var(--coral), var(--coral-deep)); }
.bigbtn.secondary { background: linear-gradient(120deg, var(--teal), color-mix(in srgb, var(--teal) 70%, #145048)); }
.bigbtn svg { width: 30px; height: 30px; }

.tiplist { margin: 22px 20px 8px; padding: 14px 16px; background: color-mix(in srgb, var(--card) 70%, transparent); border-radius: 18px; display: flex; flex-direction: column; gap: 12px; }
.tiprow { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.4; }
.tiprow svg { width: 18px; height: 18px; color: var(--coral); flex-shrink: 0; margin-top: 1px; }

/* ---------- section headers ---------- */
.sectionhead { display: flex; align-items: baseline; justify-content: space-between; padding: 0 18px; margin: 22px 0 10px; }
.sectionhead .label { display: flex; align-items: center; gap: 8px; font-size: 19px; font-weight: 700; }
.sectionhead .label svg { width: 20px; height: 20px; color: var(--coral); }
.sectionhead .count { font-size: 13px; color: var(--ink-soft); font-weight: 500; }

/* ---------- chips ---------- */
.chiprow { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 18px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 12px; border-radius: 999px; background: var(--card);
  font-size: 13.5px; font-weight: 600; border: 1px solid var(--line);
}
.chip .pct { font-weight: 700; font-size: 12px; }
.chip.used { background: color-mix(in srgb, var(--success) 14%, var(--card)); color: var(--success); border-color: transparent; }
.chip.missing { background: color-mix(in srgb, var(--warning) 16%, var(--card)); color: color-mix(in srgb, var(--warning) 70%, var(--ink)); border-color: transparent; }
.chip.filter { padding: 9px 15px; font-size: 14px; }
.chip.filter.on { background: linear-gradient(120deg, var(--coral), var(--coral-deep)); color: #fff; border-color: transparent; }

/* ---------- recipe cards ---------- */
.railwrap { padding: 0 0 4px; }
.rail { display: flex; gap: 12px; overflow-x: auto; padding: 0 18px 6px; scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; }
.rail::-webkit-scrollbar { display: none; }
.rcard {
  flex: 0 0 208px; scroll-snap-align: start;
  background: var(--card); border-radius: 20px; box-shadow: var(--shadow-sm);
  overflow: hidden; text-align: left;
}
.rcard:active { transform: scale(.98); }
.rthumb { height: 108px; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,.92); position: relative; }
.rthumb svg { width: 34px; height: 34px; }
.rthumb .heart { position: absolute; top: 8px; right: 8px; width: 24px; height: 24px; border-radius: 50%; background: rgba(0,0,0,.28); display: flex; align-items: center; justify-content: center; }
.rthumb .heart svg { width: 13px; height: 13px; color: #fff; }
.rbody { padding: 10px 12px 13px; }
.rstyle { font-size: 10.5px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--coral); }
.rname { font-size: 15px; font-weight: 700; margin: 3px 0 6px; line-height: 1.25; min-height: 38px; }
.rmeta { display: flex; gap: 9px; font-size: 12px; color: var(--ink-soft); flex-wrap: wrap; }
.rmeta span { display: inline-flex; align-items: center; gap: 3px; }
.rmeta svg { width: 12px; height: 12px; }
.rmissing { margin-top: 6px; font-size: 11.5px; font-weight: 600; color: var(--warning); }
.rok { margin-top: 6px; font-size: 11.5px; font-weight: 600; color: var(--success); }

/* grid variant for favorites */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 14px 18px 8px; }
.grid2 .rcard { flex: none; width: 100%; }

/* ---------- analysis screen ---------- */
.analysiswrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px; padding-bottom: calc(96px + var(--safe-bottom)); text-align: center; gap: 26px; }
.ring { position: relative; width: 148px; height: 148px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .track { stroke: color-mix(in srgb, var(--coral) 16%, transparent); }
.ring .bar { stroke: var(--coral); stroke-linecap: round; transform-box: fill-box; transform-origin: center; animation: spin 1.15s linear infinite; }
@media (prefers-reduced-motion: reduce) { .ring .bar { animation: none; } }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.ring .center { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--coral); }
.ring .center svg { width: 42px; height: 42px; animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 0%,100% { transform: scale(.92); } 50% { transform: scale(1.08); } }
.analysiswrap h2 { font-size: 20px; font-weight: 750; min-height: 52px; display:flex; align-items:center; }
.analysiswrap .sub { color: var(--ink-soft); font-size: 14px; max-width: 280px; }
.dots { display: flex; gap: 7px; }
.dots i { width: 8px; height: 8px; border-radius: 999px; background: color-mix(in srgb, var(--coral) 18%, transparent); transition: all .25s ease; }
.dots i.on { width: 22px; background: var(--coral); }

/* ---------- recipe detail ---------- */
.rhero { height: 220px; display: flex; align-items: flex-end; padding: 16px; color: #fff; position: relative; }
.rhero .style { font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; opacity: .9; }
.rhero h2 { font-size: 25px; font-weight: 800; margin-top: 2px; }
.factrow { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; padding: 14px 18px 4px; }
.fact { background: var(--card); border-radius: 14px; padding: 10px 4px; text-align: center; }
.fact svg { width: 17px; height: 17px; color: var(--coral); }
.fact .v { font-size: 13px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
.fact .l { font-size: 10px; color: var(--ink-soft); margin-top: 1px; }
.nutgrid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; padding: 0 18px; }
.nut { background: var(--card); border-radius: 12px; padding: 10px 4px; text-align: center; }
.nut svg { width: 15px; height: 15px; color: var(--coral); }
.nut .v { font-size: 13.5px; font-weight: 700; margin-top: 3px; font-variant-numeric: tabular-nums; }
.nut .l { font-size: 10px; color: var(--ink-soft); }
.steps { padding: 0 18px 8px; display: flex; flex-direction: column; gap: 14px; }
.step { display: flex; gap: 12px; align-items: flex-start; }
.step .n { flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%; background: linear-gradient(120deg, var(--coral), var(--coral-deep)); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 800; }
.step p { font-size: 14.5px; line-height: 1.5; padding-top: 2px; }
.dotrating { display: flex; gap: 3px; }
.dotrating i { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
.dotrating i.on { background: var(--dc, var(--coral)); }

/* ---------- filter sheet ---------- */
.sheetbg { position: fixed; inset: 0; background: rgba(20,12,8,.42); z-index: 95; opacity: 0; pointer-events: none; transition: opacity .25s ease; }
.sheetbg.show { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 96; max-width: 480px; margin: 0 auto;
  background: var(--cream); border-radius: 24px 24px 0 0; box-shadow: 0 -12px 30px rgba(0,0,0,.18);
  transform: translateY(100%); transition: transform .32s cubic-bezier(.32,.72,0,1);
  max-height: 82vh; display: flex; flex-direction: column;
  padding-bottom: calc(18px + var(--safe-bottom));
}
.sheet.show { transform: translateY(0); }
.sheet .grabber { width: 36px; height: 4px; border-radius: 3px; background: var(--line); margin: 10px auto 4px; }
.sheet .shead { display: flex; align-items: center; justify-content: space-between; padding: 8px 18px 4px; }
.sheet .shead h3 { font-size: 17px; }
.sheet .shead button { font-size: 15px; font-weight: 700; color: var(--coral); }
.sheet .sbody { overflow-y: auto; padding: 14px 18px 4px; display: flex; flex-wrap: wrap; gap: 9px; }
.sheet .sfoot { padding: 14px 18px 2px; }
.sheet .sfoot .bigbtn { padding: 15px; }

/* ---------- empty state ---------- */
.empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 30px; gap: 12px; }
.empty .ico { width: 78px; height: 78px; border-radius: 50%; background: color-mix(in srgb, var(--coral) 12%, transparent); display: flex; align-items: center; justify-content: center; color: var(--coral); }
.empty .ico svg { width: 34px; height: 34px; }
.empty h3 { font-size: 18px; }
.empty p { color: var(--ink-soft); font-size: 14px; max-width: 260px; line-height: 1.5; }

/* ---------- history rows ---------- */
.hrow { display: flex; align-items: center; gap: 12px; padding: 12px 18px; }
.hrow .thumb { width: 52px; height: 52px; border-radius: 14px; object-fit: cover; flex-shrink: 0; background: var(--card); display: flex; align-items: center; justify-content: center; color: #fff; }
.hrow .thumb svg { width: 22px; height: 22px; }
.hrow .meta { flex: 1; min-width: 0; }
.hrow .date { font-size: 15px; font-weight: 700; }
.hrow .sub2 { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }
.hrow svg.chev { width: 16px; height: 16px; color: var(--ink-soft); flex-shrink: 0; }
.divider { height: 1px; background: var(--line); margin: 0 18px; }

/* ---------- tab bar ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 90;
  max-width: 480px; margin: 0 auto;
  display: flex; padding: 8px 6px calc(8px + var(--safe-bottom));
  background: color-mix(in srgb, var(--card) 92%, transparent); backdrop-filter: blur(16px);
  border-top: 1px solid var(--line);
}
.tabbtn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 0; color: var(--ink-soft); }
.tabbtn.active { color: var(--coral); }
.tabbtn svg { width: 24px; height: 24px; }
.tabbar-label { font-size: 10.5px; font-weight: 650; }

.hidden-input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

.toast {
  position: fixed; left: 50%; bottom: 100px; transform: translate(-50%, 10px); z-index: 92;
  background: var(--ink); color: var(--cream); padding: 10px 18px; border-radius: 999px;
  font-size: 13.5px; font-weight: 600; opacity: 0; transition: all .25s ease; pointer-events: none;
  box-shadow: var(--shadow);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

.focus-ring:focus-visible { outline: 2px solid var(--coral); outline-offset: 2px; }
</style>

<div id="shell">
  <main id="home" class="tabpanel active">
    <div class="scroll" id="home-scroll"></div>
  </main>
  <main id="favorites" class="tabpanel">
    <div class="scroll" id="favorites-scroll"></div>
  </main>
  <main id="history" class="tabpanel">
    <div class="scroll" id="history-scroll"></div>
  </main>
</div>

<div id="stack"></div>
<div class="sheetbg" id="sheetbg"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<nav class="tabbar">
  <button class="tabbtn active focus-ring" data-tab="home" aria-label="Frigo"></button>
  <button class="tabbtn focus-ring" data-tab="favorites" aria-label="Favoris"></button>
  <button class="tabbtn focus-ring" data-tab="history" aria-label="Historique"></button>
</nav>

<input type="file" accept="image/*" capture="environment" class="hidden-input" id="cameraInput">
<input type="file" accept="image/*" class="hidden-input" id="galleryInput">

    let list = RECIPES.filter(t => t.mealCategory === cat.id).map(t => buildRecipe(t, availableNames));
    if (filters.size) list = list.filter(r => [...filters].every(f => matchesFilter(r, f)));
    list.sort((a, b) => (a.missingIngredients.length - b.missingIngredients.length) || (b.usedIngredients.length - a.usedIngredients.length));
    out[cat.id] = list.slice(0, cat.target);
  }
  return out;
}
function detectIngredients() {
  const shuffled = [...CATALOG].sort(() => Math.random() - 0.5);
  const count = 12 + Math.floor(Math.random() * 9);
  return shuffled.slice(0, count).map(i => ({ name: i.name, category: i.category, confidence: 0.62 + Math.random() * 0.37 }))
    .sort((a, b) => b.confidence - a.confidence);
}

    return `<span class="chip">${esc(i.name)} <span class="pct" style="color:${color}">${pct}%</span></span>`;

/* ================= NAVIGATION (stack) ================= */
function pushScreen(html, opts) {
  const wrap = document.createElement("div");
  wrap.className = "screen";
  wrap.innerHTML = html;
  document.getElementById("stack").appendChild(wrap);
  state.stack.push({ el: wrap, ...opts });
  requestAnimationFrame(() => requestAnimationFrame(() => wrap.classList.add("in")));
  bindScreenEvents(wrap);
  return wrap;
}
function popScreen() {
  const top = state.stack.pop();
  if (!top) return;
  top.el.classList.remove("in");
  setTimeout(() => top.el.remove(), 340);
  if (top.onPop) top.onPop();
}
function bindScreenEvents(scope) {
  scope.querySelectorAll("[data-pop]").forEach(b => b.onclick = () => popScreen());
  scope.querySelectorAll("[data-open-recipe]").forEach(b => b.onclick = () => {
    const r = findRecipeById(b.getAttribute("data-open-recipe"));
    if (r) pushScreen(detailScreenHTML(r));
  });
  scope.querySelectorAll("[data-fav]").forEach(b => b.onclick = () => {
    const r = findRecipeById(b.getAttribute("data-fav"));
    if (r) { toggleFavorite(r); const html = detailScreenHTML(r); scope.innerHTML = html; bindScreenEvents(scope); requestAnimationFrame(()=>scope.classList.add("in")); renderFavorites(); }
  });
  const filtersBtn = scope.querySelector("#btnOpenFilters");
  if (filtersBtn) filtersBtn.onclick = openFilterSheet;
}
let lastSession = null;
function findRecipeById(id) {
  if (lastSession) { for (const cat of CATS) { const hit = (lastSession.recipesByCategory[cat.id] || []).find(r => r.id === id); if (hit) return hit; } }
  const fav = state.favorites.find(r => r.id === id);
  if (fav) return fav;
  for (const h of state.history) for (const cat of CATS) { const hit = (h.recipesByCategory[cat.id] || []).find(r => r.id === id); if (hit) return hit; }
  return null;
}

/* ================= ANALYSIS FLOW ================= */
const STAGES = [
  { title: "Analyse de votre réfrigérateur…", sub: "Votre photo est en cours de traitement.", icon: "fridge" },
  { title: "Identification des ingrédients…", sub: "Notre IA repère légumes, fruits, produits laitiers et plus encore.", icon: "check" },
  { title: "Génération de recettes…", sub: "Des idées de repas réalistes sont en préparation.", icon: "fork" },
];
function analysisScreenHTML() {
  return `<div class="analysiswrap">
    <div class="ring">
      <svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="42" fill="none" stroke-width="9"/><circle class="bar" cx="50" cy="50" r="42" fill="none" stroke-width="9" stroke-dasharray="66 198"/></svg>
      <div class="center" id="stageIcon">${icon(STAGES[0].icon, 'width="42" height="42"')}</div>
    </div>
    <div>
      <h2 id="stageTitle">${STAGES[0].title}</h2>
      <p class="sub" id="stageSub">${STAGES[0].sub}</p>
    </div>
    <div class="dots">${STAGES.map((_, i) => `<i class="${i === 0 ? "on" : ""}"></i>`).join("")}</div>
  </div>`;
}
function startAnalysis(dataUrl) {
  const screen = pushScreen(analysisScreenHTML());
  let stageIdx = 0;
  function setStage(i) {
    stageIdx = i;
    screen.querySelector("#stageTitle").textContent = STAGES[i].title;
    screen.querySelector("#stageSub").textContent = STAGES[i].sub;
    screen.querySelector("#stageIcon").innerHTML = icon(STAGES[i].icon, 'width="42" height="42"');
    screen.querySelectorAll(".dots i").forEach((d, di) => d.classList.toggle("on", di === i));
  }
  setTimeout(() => setStage(1), 900);
  setTimeout(() => setStage(2), 2300);
  setTimeout(() => {
    const ingredients = detectIngredients();
    const recipesByCategory = generateRecipesByCategory(ingredients, state.activeFilters);
    const session = { id: "a" + Date.now(), date: Date.now(), thumb: dataUrl, ingredients, recipesByCategory };
    lastSession = session;
    state.history = [session, ...state.history].slice(0, 30);
    saveHistory();
    popScreen();
    pushScreen(resultsScreenHTML(session), {});
  }, 3500);
}

/* ================= FILTER SHEET ================= */
function openFilterSheet() {
  const bg = document.getElementById("sheetbg"), sheet = document.getElementById("sheet");
  const draft = new Set(state.activeFilters);
  function render() {
    sheet.innerHTML = `
      <div class="grabber"></div>
      <div class="shead"><h3>Filtres</h3><button id="applyF">Appliquer</button></div>
      <div class="sbody">${FILTERS.map(f => `<button class="chip filter ${draft.has(f.id) ? "on" : ""} focus-ring" data-f="${f.id}">${esc(f.label)}</button>`).join("")}</div>
      <div class="sfoot"><button class="bigbtn secondary" id="resetF" style="background:var(--card);color:var(--ink);box-shadow:none;border:1px solid var(--line)">Réinitialiser</button></div>`;
    sheet.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { const id = b.getAttribute("data-f"); draft.has(id) ? draft.delete(id) : draft.add(id); render(); });
    sheet.querySelector("#resetF").onclick = () => { draft.clear(); render(); };
    sheet.querySelector("#applyF").onclick = () => {
      state.activeFilters = new Set(draft);
      closeSheet();
      if (lastSession) { lastSession.recipesByCategory = generateRecipesByCategory(lastSession.ingredients, state.activeFilters); refreshTopResultsScreen(); }
    };
  }
  render();
  bg.classList.add("show"); sheet.classList.add("show");
  bg.onclick = closeSheet;
}
function closeSheet() { document.getElementById("sheetbg").classList.remove("show"); document.getElementById("sheet").classList.remove("show"); }
function refreshTopResultsScreen() {
  const top = state.stack[state.stack.length - 1];
  if (!top || !lastSession) return;
  top.el.innerHTML = resultsScreenHTML(lastSession);
  bindScreenEvents(top.el);
}

/* ================= HISTORY OPEN ================= */
document.addEventListener("click", (e) => {
  const histBtn = e.target.closest("[data-open-history]");
  if (histBtn) { const idx = +histBtn.getAttribute("data-open-history"); lastSession = state.history[idx]; pushScreen(resultsScreenHTML(lastSession)); }
});

/* ================= FILE INPUTS ================= */
function handleFile(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => startAnalysis(reader.result);
  reader.readAsDataURL(file);
  input.value = "";
}
document.getElementById("cameraInput").onchange = e => handleFile(e.target);
document.getElementById("galleryInput").onchange = e => handleFile(e.target);

/* ================= TAB BAR ================= */
function setTabIcons() {
  document.querySelectorAll(".tabbtn")[0].innerHTML = icon("fridge", 'width="24" height="24"') + '<span class="tabbar-label">Frigo</span>';
  document.querySelectorAll(".tabbtn")[1].innerHTML = icon("heart", 'width="24" height="24"') + '<span class="tabbar-label">Favoris</span>';
  document.querySelectorAll(".tabbtn")[2].innerHTML = icon("clock", 'width="24" height="24"') + '<span class="tabbar-label">Historique</span>';
}
function clearStack() {
  state.stack.forEach(s => s.el.remove());
  state.stack = [];
  closeSheet();
}
document.querySelectorAll(".tabbtn").forEach(btn => btn.addEventListener("click", () => {
  const tab = btn.getAttribute("data-tab");
  state.tab = tab;
  clearStack();
  document.querySelectorAll(".tabpanel").forEach(p => p.classList.toggle("active", p.id === tab));
  document.querySelectorAll(".tabbtn").forEach(b => b.classList.toggle("active", b === btn));
  if (tab === "favorites") renderFavorites();
  if (tab === "history") renderHistory();
}));

/* ================= INIT ================= */
setTabIcons();
renderHome();
renderFavorites();
renderHistory();
</script>
